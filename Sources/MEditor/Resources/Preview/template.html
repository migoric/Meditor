<!DOCTYPE html>
<html lang="en" class="theme-{{INITIAL_THEME}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  CSP（第二道防线，主防线是 render/markdown.js 的 DOMPurify 消毒）：
  - script-src 'self' file:：只跑随模板加载的本地脚本，内联脚本/事件处理
    一律禁掉（初始内容改由下面的 JSON 数据块传递，不依赖 inline script）。
    file:// 页面在 WebKit 里 'self' 语义不稳，显式补上 file:。
  - connect-src 'none'：禁 fetch/XHR/beacon，堵住外泄通道。
  - img-src / media-src 保留 meditor-asset:/file:（本地图片与音视频）与 http(s)/data:（远程与内联）。
  - style-src 'unsafe-inline'：mermaid SVG 内嵌 <style>、导出注入的 <style> 都依赖它。
  - font-src 必须含 file:：KaTeX 的数学字体（css/fonts/*.woff2）是与页面同目录的
    本地文件，file:// 页面在 WebKit 里 'self' 语义不稳（同上），不放行 file:
    时公式会退化成方块/乱码。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: meditor-asset: data: https: http:; media-src 'self' file: meditor-asset: data: https: http:; font-src 'self' file: data:; connect-src 'none'; object-src 'none'">
<title>MEditor Preview</title>

<!-- All themes inlined as one stylesheet — switching themes is just a
     class change on <html>, no stylesheet swap or reload. -->
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">

<!-- KaTeX 样式。字体路径是相对本样式表解析的（CSS 规范里 url() 以样式表自身
     为基准，不受页面 <base href> 影响），所以 fonts/ 必须与 katex.min.css 同级
     —— 即 css/katex.min.css + css/fonts/*.woff2。 -->
<link rel="stylesheet" href="css/katex.min.css">

<!-- Preload hljs so it's in HTTP cache when first code block triggers it -->
<link rel="preload" href="highlight.min.js" as="script">

<!-- Vendor: marked for Markdown parsing (sync — needed immediately) -->
<script src="marked.min.js"></script>

<!-- Vendor: DOMPurify — sanitize marked output before it touches the DOM -->
<script src="purify.min.js"></script>

<!-- highlight.js: load synchronously so hljs is available on first render -->
<script src="highlight.min.js"></script>

<!-- KaTeX：同步加载。267KB，远小于 mermaid（3.3MB），且公式要在首帧就位位，
     懒加载会让长文档在滚动时公式陆续弹出。render/math.js 里 katex 缺失时静默降级
     （数学片段原样保留为 $...$ 文本）。 -->
<script src="katex.min.js"></script>

<!-- mermaid.min.js (3.3MB) 不在这里同步加载：render/mermaid.js 遇到 mermaid 图时
     动态注入 <script>，Swift 侧负责届时把文件复制进缓存目录。 -->

<!-- MEditor scripts -->
<!-- 锚点守卫：`<base href>` 会把 `#fragment` 一并改写成 asset URL，点击后 WebKit
     既不导航也不滚动，连 decidePolicyFor 都不回调。守卫在页内接管这类点击。
     文件由 PreviewAssetMirror 生成（源在 HTMLAnchorGuard.swift），必须是外链脚本，
     内联会被上面的 CSP（script-src 'self' file:）拦掉。 -->
<script src="scripts/anchor-guard.js"></script>
<script src="scripts/render/state.js"></script>
<script src="scripts/render/markdown.js"></script>
<script src="scripts/render/math.js"></script>
<script src="scripts/render/mermaid.js"></script>
<script src="scripts/render/blocks.js"></script>
<script src="scripts/render/dom-patch.js"></script>
<script src="scripts/render/enhancements.js"></script>
<script src="scripts/render.js"></script>
<script src="scripts/bridge.js"></script>
<script src="scripts/boot.js"></script>
</head>
<body>
<div id="content"></div>
<!--
  初始内容以 JSON 数据块传递（非可执行 script，CSP 不拦截）。
  Swift 侧写入前已把内容里的 "<" 转成 Unicode 转义序列，防止 "</script>" 提前闭合数据块。
-->
<script id="meditor-initial-content" type="application/json">{{INITIAL_CONTENT_JSON}}</script>
</body>
</html>
