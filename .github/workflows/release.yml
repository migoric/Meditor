name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 的发布串行化；进行中的发布不取消，避免留下半发布状态。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & Test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  release:
    name: Build & Release
    needs: [test]
    # macos-26：发布包必须用 macOS 26 SDK 链接，否则在 Tahoe 上是旧式灰侧栏，
    # 没有 Liquid Glass（外观按构建时 SDK 决定，与用户系统无关）
    runs-on: macos-26
    timeout-minutes: 90
    environment: release

    env:
      # Sparkle 更新分发（workers.dev）：worker 端点见 worker/index.js
      UPDATE_BASE: https://meditor-app.863129776.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成更新日志需要完整 tag 历史（git log 上一 tag..当前 tag）
          fetch-depth: 0

      - name: Guard release ref
        run: |
          # workflow_dispatch 可以指向任意 ref；只有 v* tag 才允许发版
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::Release 只能从 v* tag 触发（当前 GITHUB_REF=${GITHUB_REF}）。请推送形如 v1.2.3 的 tag，或 workflow_dispatch 时选择该 tag。"
            exit 1
          fi

      - name: Verify tag matches VERSION
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 必须匹配 ^v[0-9]+\\.[0-9]+\\.[0-9]+$"
            exit 1
          fi
          VERSION_FILE="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION_FILE}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 VERSION（${VERSION_FILE}）不一致——请先把 VERSION 更新为 ${GITHUB_REF_NAME#v} 再打 tag。"
            exit 1
          fi
          echo "version verified: ${GITHUB_REF_NAME} (VERSION=${VERSION_FILE})"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Bundle .app
        run: |
          # 版本号取 git tag（去 v 前缀）；build 号用 run_number（单调整型）——
          # Sparkle 按 CFBundleVersion 比新旧，整型才能盖过 1.1 时代的老包
          export MEDITOR_VERSION="${GITHUB_REF_NAME#v}"
          export MEDITOR_BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          bash scripts/bundle.sh release
          ditto -c -k --keepParent .build/release/MEditor.app MEditor-${{ github.ref_name }}.zip

      - name: Sign update package
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # 自研签名脚本（scripts/sign_update.swift，CryptoKit 标准 Ed25519）——
          # 不依赖 Sparkle 工具包下载，密钥格式与本地生成端天然一致。
          # 先校验 SPARKLE_ED_PRIVATE_KEY 派生出的公钥与仓库内固定公钥一致，
          # 不匹配就 exit(1)——避免用错密钥签名后才在客户端更新失败。
          set -o pipefail
          SIG=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | tr -d '[:space:]')
          EXPECTED_PUBKEY="$(tr -d '[:space:]' < scripts/sparkle-ed-public-key.txt)"
          swift scripts/sign_update.swift "$SIG" "MEditor-${{ github.ref_name }}.zip" \
            --expect-public-key "$EXPECTED_PUBKEY" | tee /tmp/sign_output.txt

      - name: Build appcast.xml
        run: |
          python3 - <<'PYEOF'
          import os, re, subprocess, datetime
          from xml.dom import minidom
          sig = re.search(r'sparkle:edSignature="([^"]*)"', open('/tmp/sign_output.txt').read()).group(1)
          tag = os.environ['GITHUB_REF_NAME']
          version = tag.lstrip('v')
          build = os.environ['GITHUB_RUN_NUMBER']
          base = os.environ['UPDATE_BASE']
          length = os.path.getsize(f'MEditor-{tag}.zip')
          pubdate = datetime.datetime.now(datetime.timezone.utc).strftime('%a, %d %b %Y %H:%M:%S +0000')
          # 更新日志：上一个 tag 到当前 tag 的提交标题，过滤 chore/merge 噪音
          import html as htmllib
          prev = subprocess.run(['git', 'describe', '--tags', '--abbrev=0', f'{tag}^'],
                                capture_output=True, text=True).stdout.strip()
          rng = f'{prev}..{tag}' if prev else tag
          log = subprocess.run(['git', 'log', '--pretty=%s', '--no-merges', rng],
                               capture_output=True, text=True).stdout
          lines = [l for l in log.splitlines()
                   if l.strip() and not l.startswith(('chore', 'Merge'))][:20]
          items = ''.join(f'<li>{htmllib.escape(l)}</li>' for l in lines)
          description = f'<ul>{items}</ul>' if items else ''
          desc_xml = f'<description><![CDATA[{description}]]></description>' if description else ''
          xml = f'''<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>MEditor Updates</title>
              <item>
                <title>{tag}</title>
                <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
                <sparkle:version>{build}</sparkle:version>
                <pubDate>{pubdate}</pubDate>
                {desc_xml}
                <enclosure url="{base}/update/pkg"
                           sparkle:shortVersionString="{version}"
                           sparkle:version="{build}"
                           length="{length}"
                           type="application/octet-stream"
                           sparkle:edSignature="{sig}"/>
              </item>
            </channel>
          </rss>
          '''
          minidom.parseString(xml)  # 合法性检查
          open('/tmp/appcast.xml', 'w').write(xml)
          PYEOF

      - name: Publish update to workers.dev
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          curl -sfS --retry 3 -w "\npkg upload: %{http_code}\n" -X POST "$UPDATE_BASE/api/update/pkg" \
            -H "Authorization: Bearer $UPDATE_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary "@MEditor-${{ github.ref_name }}.zip"
          curl -sfS --retry 3 -w "\nappcast upload: %{http_code}\n" -X POST "$UPDATE_BASE/api/update/appcast" \
            -H "Authorization: Bearer $UPDATE_TOKEN" \
            -H "Content-Type: application/xml" \
            --data-binary "@/tmp/appcast.xml"

      - name: Verify published update
        run: |
          # 从 CI 网络回放客户端视角：appcast 可取、指向当前 tag、安装包字节数一致
          curl -sf "$UPDATE_BASE/update/appcast.xml" -o /tmp/published-appcast.xml
          grep -q "${GITHUB_REF_NAME}" /tmp/published-appcast.xml
          LOCAL_LEN=$(stat -f%z "MEditor-${{ github.ref_name }}.zip")
          REMOTE_LEN=$(curl -sf "$UPDATE_BASE/update/pkg" -o /tmp/published-pkg.zip && stat -f%z /tmp/published-pkg.zip)
          test "$LOCAL_LEN" = "$REMOTE_LEN" && echo "update feed verified ($REMOTE_LEN bytes)"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: MEditor-*.zip
          draft: false
          generate_release_notes: true
