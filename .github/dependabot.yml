# 依赖更新自动化。
#
# Swift 侧只有**一个**直接依赖：Sparkle 2（自动更新）。它同时被两种方式引用
# （Package.swift 的远程 SPM 包 / Vendor/ 下的本地 binaryTarget），升级要看两边。
# worker/ 是独立的 Cloudflare Workers 工具链（纯 JS，无运行时依赖）。
version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  # worker 无运行时依赖，但锁文件与工具链仍要跟。
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
