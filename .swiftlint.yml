# MEditor SwiftLint 配置
#
# 策略：安全相关规则（force_cast / force_try / force_unwrapping）作为硬性 error，
# 风格噪音规则整体禁用（历史代码风格与默认规则冲突，不强行重构）。
# CI 中 swiftlint lint 跑的是 `--strict`：**任何 warning 都会让 job 变红**
# （--strict 把 warning 当失败）。所以本文件里所有 `warning:` 档位实质都是硬闸门，
# 不是提示——想放宽就只能把数值调大，不能指望它「只是提醒」。
# 这条此前写反了（原文声称只有 error 级违规才让 CI 失败、warning 只是提示），
# 与 build.yml 的 --strict 直接矛盾，已由 scripts/check_docs_consistency.py 看住。

# 禁用规则：与项目既有风格冲突的纯样式噪音
disabled_rules:
  - comma                    # 参数换行风格（逗号在行尾）
  - colon                     # 字典/类型冒号空格风格
  - opening_brace             # 大括号换行风格
  - trailing_comma            # 尾随逗号风格
  - vertical_whitespace       # 空行数量风格
  - trailing_newline          # 文件末尾空行风格
  - statement_position        # 语句起始缩进风格
  - multiple_closures_with_trailing_closure
  - vertical_parameter_alignment
  - implicit_getter
  - for_where
  - control_statement
  - comment_spacing
  - unused_optional_binding
  - type_name
  - nesting
  - function_parameter_count  # 参数数量不做硬限制
  - implicit_optional_initialization
  - identifier_name           # 允许 i/url/idx 等短名（352 处历史违规）
  - line_length               # 行宽不做硬限制（258 处历史违规）
  - function_body_length
  - type_body_length
  - cyclomatic_complexity

# 主动开启的额外规则（安全/正确性相关）
opt_in_rules:
  - force_unwrapping          # 禁止强制解包（error，见下方 severity）
  - empty_count               # 优先 isEmpty（error，见下方 severity）

# force_unwrapping 提升为硬性 error（CI 门槛）
force_unwrapping:
  severity: error

# empty_count 显式钉死为 error，与 docs/engineering-practices.md 声明的
# "安全规则硬性 error" 策略一致，且不依赖 SwiftLint 各版本的默认 severity。
empty_count:
  severity: error

# file_length：CI 用 --strict，所以下面这两档都是硬闸门（1500 行起就红）。
# 阈值设在当前最大文件（Localization.swift）之上。
file_length:
  warning: 1500
  error: 2000

# 目录排除
excluded:
  - .build
  - Vendor
  - Mobile
  - Tests
  - Sources/MEditor/Debug
  - Sources/MEditorQuickLook
