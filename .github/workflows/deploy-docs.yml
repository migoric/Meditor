name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'wrangler.toml'
      - 'scripts/deploy-docs.sh'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 预检：缺 token 时给出明确指引，而不是 wrangler 的原始报错
      - name: Check token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN secret。请到 Cloudflare My Profile → API Tokens 用 'Edit Cloudflare Workers' 模板创建，然后加入仓库 Settings → Secrets and variables → Actions。"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # 需要在仓库 Settings → Secrets 配置 CLOUDFLARE_API_TOKEN
      # （My Profile → API Tokens → 创建，模板 "Edit Cloudflare Workers"）。
      # 若账号下有多个 Cloudflare 账户，再补 CLOUDFLARE_ACCOUNT_ID。
      - name: Deploy
        run: bash scripts/deploy-docs.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
