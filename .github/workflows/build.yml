name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 的新 push/PR 取消旧构建，省 runner 且让结果只看最新
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 = Xcode 26：与 release 包同 SDK，compiler(>=6.2) 分支（Liquid Glass
    # 相关 API）在 PR CI 里就能编到，而不是等到打 tag 才暴露问题
    name: Build & Test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Archive .app bundle
        run: |
          bash scripts/bundle.sh
          ditto -c -k --keepParent .build/debug/MEditor.app MEditor.zip

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEditor-macOS
          path: MEditor.zip
          compression-level: 0

  ios:
    name: Build (iOS Simulator)
    # macos-15 = Xcode 16+：项目文件是 objectVersion 77（文件系统同步组），
    # macos-14 默认的 Xcode 15.4 打不开（"future Xcode project file format (77)"）。
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Gate only: no iOS test target exists. Generic simulator destination
      # (no simulator ID available on CI runners); signing disabled.
      - name: Build (iOS Simulator)
        run: >-
          xcodebuild
          -project Mobile/MEditorMobile.xcodeproj
          -scheme MEditorMobile
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO

  shared-guard:
    name: iOS Shared Source Guard
    # 纯脚本检查：工程文件 ↔ 磁盘 ↔ 编译阶段三者自洽，并挡住 macOS-only 符号
    # 与 AppSettings 读取进入共享文件。放 Linux runner——秒级完成，比 macOS 便宜
    # 一个数量级；真正的编译验证仍由上面的 ios job 负责。
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check iOS shared sources
        run: python3 scripts/check_ios_shared_sources.py

  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # portable 版是 universal 二进制（x86_64 + arm64），比 brew 更稳、更快。
      # 固定版本：releases/latest 会随上游静默升级，可能突然引入新规则/新行为。
      - name: Install SwiftLint (portable 0.65.0)
        run: |
          curl -sL -o /tmp/swiftlint.zip             https://github.com/realm/SwiftLint/releases/download/0.65.0/portable_swiftlint.zip
          unzip -o -q /tmp/swiftlint.zip -d /tmp/swiftlint

      - name: Lint
        # --strict：warning 也视为失败。当前基线 0 warning，闸门从此对警告敏感。
        run: /tmp/swiftlint/swiftlint lint --strict --config .swiftlint.yml Sources

  coverage:
    name: Coverage Gate
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Export lcov
        run: |
          xcrun llvm-profdata merge -o default.profdata .build/**/codecov/*.profraw
          xcrun llvm-cov export             .build/**/MEditorPackageTests.xctest/Contents/MacOS/MEditorPackageTests             -instr-profile default.profdata --format=lcov > coverage.lcov

      - name: Enforce coverage gate
        run: python3 scripts/coverage_gate.py coverage.lcov
